<!doctype html>
<!-- `lang` is the pre-bundle DEFAULT, not the app's answer: `providers/LocaleProvider.tsx` sets it from
     the active locale (the manual override, else the browser's) as soon as it mounts, so a Chinese reader
     gets `zh-Hant`/`zh-Hans` a frame in. It stays declared here because a document with no `lang` is worse
     than one with a stated guess — and it is not read from localStorage by an inline script for the same
     reason `main.tsx` refuses to do that for the appearance class: that would be a second declaration of
     the storage key and of the fallback rule, in a file no gate reads. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NextBus HK</title>

    <!-- Installable PWA (WP6-0). `manifest.webmanifest` and every icon it names are generated into
         public/ by scripts/gen-icons.mjs, from the ink TOKEN — so the launcher's splash and the mark on
         it cannot end up a shade apart, and there is no hex literal in this file to drift. The
         apple-touch-icon is a <link> because iOS reads it here and ignores the manifest's icons. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NextBus HK" />
    <!-- No `theme-color` here on purpose: `lib/appearance.ts` creates it from the active theme's `--bg`,
         so it follows a light/dark switch instead of being pinned to one of them. -->
  </head>
  <body>
    <!-- `class="light"` is not set here: the appearance class goes on <html> from main.tsx, so the
         first paint already carries it and there is no flash of the wrong theme. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
