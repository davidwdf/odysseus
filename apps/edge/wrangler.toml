name = "nextbus-edge"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── The custom domain, ready for the day it exists (WP0-5) ─────────────────────────────────────
# Deliberately commented, and deliberately without a hostname: inventing one would be claiming a
# deployment. When the domain is registered and its zone is on this Cloudflare account, uncomment
# both blocks, put the real hostname in `pattern`, and set `EXPO_PUBLIC_API_URL` / `VITE_API_URL` to
# `https://<that host>` — one variable per renderer, because the `/v1/live` socket URL is derived
# from it and not configured (ADR-056 decision 8).
#
# `workers_dev = false` matters here specifically, and it is not tidiness. Left at its default, the
# Worker also answers on `<name>.<subdomain>.workers.dev` — a **second live hostname for one Worker**,
# which is a second value `EXPO_PUBLIC_API_URL` could point at. This project's top-priority failure
# mode is exactly that: one change reaching the platforms unequally. Two hostnames also means the
# service worker's runtime-caching routes (baked from the API origin by `build:web`) match on one and
# not the other, so a PWA built against the wrong one caches nothing and reports no error.
#
# `custom_domain = true` asks Cloudflare to create the DNS record and the certificate for an apex or
# subdomain the Worker owns outright. The alternative is a zone route — `pattern = "api.example.com/*"`
# with `zone_name = "example.com"` — which shares the hostname with other origins and is what you want
# only if something else already serves that host. We want the former.
#
# [[routes]]
# pattern = "REPLACE_WITH_API_HOSTNAME"   # e.g. api.<domain> — no scheme, no trailing slash
# custom_domain = true
#
# workers_dev = false

# Precomputed dataset shards, content-addressed by build hash (ADR-055 / WP0-1).
#
# There is no `[triggers] crons` any more: the daily normalization runs in GitHub Actions
# (.github/workflows/dataset.yml), not in the Worker. That is the point of WP0-1 — the 8.3 MB
# fetch, the clustering and the ~20 MB of heap all happen outside the request path, and a
# 128 MB Durable Object could never have done it at all (WP5-3 depends on this).
#
# `Env`'s bindings are optional, so a namespace-less Worker still runs: it falls back to
# building the index in-request and says so on `/v1/health`. Create the resources with
#   wrangler kv namespace create DATASET
#   wrangler r2 bucket create nextbus-builds
# then replace the placeholder id below. `/v1/health` must report
# `"dataset":"kv"` and `datasetBuildsThisIsolate: 0` once it's wired.

[[kv_namespaces]]
binding = "DATASET"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# The preview namespace ADR-061 decision 2 already owes, and the cheapest of the three lines WP0-5
# needs. `wrangler kv namespace create DATASET --preview` prints it; `wrangler dev --remote` and
# `wrangler versions upload` read it, so the ~20k-key prune in `publish-dataset.mts` can be rehearsed
# twice against a namespace that is not production (docs/10 "Environments"). Uncomment with the id.
# preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

[[r2_buckets]]
binding = "BUILDS"
bucket_name = "nextbus-builds"

# The `/v1/live` shards (WP5-3). Sharded, not one object per stop: a shard serves whatever its
# subscribers ask for and is chosen from the client's target set (`liveShardFor`, D4), so that one
# client needs one socket and clients watching the same places share one upstream poll.
#
# `Env.ETA_HUB` is **optional** like DATASET/BUILDS, so a Worker with no Durable Object still runs:
# `/v1/live` answers with the taxonomy and every client keeps working on the poll transport.
[[durable_objects.bindings]]
name = "ETA_HUB"
class_name = "EtaHub"

# `new_sqlite_classes`, and this line is load-bearing in two directions.
#
#  1. **It must not be `new_classes`.** The key-value storage backend is Paid-only *and* only available
#     to accounts that already have a KV-backed namespace, so it is not a live option for a new project
#     at all; SQLite-backed objects work on Free and Paid. The backend also cannot be changed after the
#     first deploy — switching later fails, and the only way through is delete-and-reprovision with full
#     data loss.
#  2. **Omitting the block entirely is worse than getting it wrong.** Wrangler maps the class to
#     `useSQLite: undefined`, Miniflare reads that as `false`, and `ctx.storage.sql` then throws at
#     runtime — while every binding still looks present and the specs still run. That is this repo's
#     recurring failure shape (a gate passing because it is looking at nothing), sitting in a config file.
#
# The newer declarative form (`[exports.EtaHub] storage = "sqlite"`) is equivalent for local dev and for
# deploy, and is what Cloudflare now recommends for a new Worker. It is deliberately **not** used yet:
# `wrangler versions upload` fails fast when `exports` entries are present, gradual deployments are
# unsupported for its lifecycle changes, a rollback cannot cross one, and the move is one-way. WP0-5 has
# not happened, so nothing has ever been deployed from here — and giving up versions, gradual rollout and
# rollback before the first deploy is a worse trade than staying on the array form, which is still fully
# supported. The two are mutually exclusive at the config layer, so this is one decision, made once.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EtaHub"]
