name: dataset

# The daily static-data build (WP0-1 / ADR-055).
#
# This runs **here, not in the Worker**, and that is the whole point: the job fetches 8.3 MB,
# normalizes it, runs the ADR-042 clustering and writes ~20k content-addressed shards. In a
# Worker that cost ~20 MB of heap and a few hundred ms on every cold isolate; in a 128 MB
# Durable Object it would not fit at all (which is why WP5-3 has this as a hard prerequisite).
#
# `publish-dataset.mts` writes every shard first and flips the single mutable `build:current`
# key last, so a failed run leaves an unreachable orphan rather than a half-served dataset.

on:
  schedule:
    # 19:00 UTC = 03:00 HKT — after the operators' own overnight updates, well off peak.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish even if the upstream data is unchanged'
        type: boolean
        default: false

concurrency:
  # Never two publishes at once: they would interleave shard writes and race the pointer flip.
  group: dataset-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Armed by a repo variable, not by merging this file. WP0-5 hasn't happened yet — there is no KV
    # namespace and no API token — so an unguarded schedule fails every night and trains everyone to
    # ignore a red cron. Set `DATASET_PUBLISH_ARMED=true` (Settings → Secrets and variables →
    # Actions → Variables) once `wrangler kv namespace create DATASET` has run and the secrets
    # exist; see docs/10 "Configuration & secrets".
    #
    # A manual `workflow_dispatch` always runs: asking for it by hand is the opt-in, and it's how
    # you'd test the credentials before arming the schedule.
    if: github.event_name == 'workflow_dispatch' || vars.DATASET_PUBLISH_ARMED == 'true'
    # The build is a couple of seconds; the ~20k KV writes are the long pole.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail before touching KV if the derivations are broken — the shard shapes are covered by
      # apps/edge/test/dataset-kv.test.ts, including the "builds the dataset zero times" gate.
      - run: pnpm typecheck
      - run: pnpm test

      # Say what's missing, in one line, instead of letting it surface 40 s later as a wrangler
      # exec error mid-publish. The first run without this reported only
      # `Command failed: npx wrangler kv key put build:history` with the placeholder id echoed
      # inside a stack trace.
      - name: Preflight — credentials and bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/10 'Configuration & secrets'."
              fail=1
            fi
          done
          if grep -q REPLACE_WITH_KV_NAMESPACE_ID apps/edge/wrangler.toml; then
            echo "::error::apps/edge/wrangler.toml still has the placeholder KV namespace id. Run 'wrangler kv namespace create DATASET' and commit the real id."
            fail=1
          fi
          exit $fail

      - name: Build and publish
        run: pnpm dataset:publish ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The acceptance criterion, checked against the deployed Worker rather than a test double:
      # if `datasetBuildsThisIsolate` is anything but 0, the dataset is back in the request path.
      - name: Verify the Worker is serving from KV
        if: env.EDGE_URL != ''
        env:
          EDGE_URL: ${{ vars.EDGE_URL }}
        run: |
          health=$(curl -fsS "$EDGE_URL/v1/health")
          echo "$health"
          echo "$health" | grep -q '"dataset":"kv"' \
            || { echo "::error::Worker is not serving from KV"; exit 1; }
          echo "$health" | grep -q '"datasetBuildsThisIsolate":0' \
            || { echo "::error::Worker built the dataset in-request"; exit 1; }
